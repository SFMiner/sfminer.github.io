<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantastic Voyage performance page</title>
<style>
	:root { color-scheme: light dark; }
	body { margin: 0; padding: 6px 10px; font: 14px/1.35 system-ui, sans-serif; background: Canvas; color: CanvasText; }
	h1 { font-size: 16px; margin: 0 0 2px; }
	p { margin: 2px 0 6px; }
	.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
	button, select { font: inherit; padding: 4px 10px; min-height: 32px; }
	#status { font-weight: 600; }
	#game { display: block; border: 1px solid GrayText; background: #000; width: 100%; height: 400px; }
	table { border-collapse: collapse; margin: 8px 0; width: 100%; max-width: 900px; }
	th, td { border: 1px solid GrayText; padding: 3px 8px; text-align: left; vertical-align: top; }
	th { background: color-mix(in srgb, CanvasText 10%, Canvas); }
	td.num { font-variant-numeric: tabular-nums; }
	#results-text { width: 100%; max-width: 900px; height: 14em; font: 12px/1.3 ui-monospace, Consolas, monospace; box-sizing: border-box; }
	#results-section h2 { font-size: 15px; margin: 8px 0 2px; }
</style>
</head>
<body>
<h1>Fantastic Voyage performance page</h1>
<p>Press Begin, then fly right with D or the Right arrow until the measurement ends.</p>
<div class="row">
	<button id="start" type="button">Start 60 s measurement</button>
	<button id="cold" type="button">Cold load &times;5</button>
	<button id="reload" type="button">Reload game</button>
	<label>Frame size <select id="size">
		<option value="fit">Fit window</option>
		<option value="1366x768">1366 x 768</option>
		<option value="1180x500">1180 x 500</option>
	</select></label>
	<span id="status" role="status" aria-live="polite">Idle</span>
</div>
<iframe id="game" title="Game under measurement"></iframe>
<div id="results-section">
	<h2>Results</h2>
	<table id="results">
		<thead><tr><th scope="col">Measurement</th><th scope="col">Value</th><th scope="col">Unit</th></tr></thead>
		<tbody id="results-body"></tbody>
	</table>
	<h2>Copyable text</h2>
	<textarea id="results-text" readonly></textarea>
</div>
<script src="perf.js"></script>
</body>
</html>
